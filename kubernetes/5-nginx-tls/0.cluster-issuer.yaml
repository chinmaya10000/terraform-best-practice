apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: http-01-production
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: your-email@devopsbyexample.com  # Replace with your email
    privateKeySecretRef:
      name: http-01-production-cluster-issuer
    solvers:
    - http01:
        ingress:
          class: external-nginx
# Note: Ensure that the Ingress class matches the one used in your Ingress resource
